<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 180px;
        background: #fff;
        color: #000;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      button {
        all: unset;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        width: 100%;
        padding: 16px;
        cursor: pointer;
      }
      button:hover {
        background: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <button id="enabled"><span>Noir</span><span class="state">…</span></button>
    <button id="dark"><span>Dark</span><span class="state">…</span></button>
    <script src="popup.js"></script>
  </body>
</html>
